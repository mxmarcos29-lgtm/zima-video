<!doctype html>

<head>
<meta charset="utf-8">

</head>

<div id="app">
  <!-- ============ NAVEGADOR DE ARQUIVOS ============ -->
  <aside id="sidebar" class="sidebar" aria-label="Navegação">
    <button class="side-brand" id="side-brand"><img src="icon.svg" alt=""><span>Zima Video</span></button>
    <nav id="side-body"></nav>
  </aside>
  <header class="topbar">
    <button class="icon-btn" id="btn-up" aria-label="Voltar"><svg><use href="#i-back"/></svg></button>
    <div class="brand" id="brand"><img class="logo" src="icon.svg" alt=""><span id="title">Zima Video</span></div>
    <div class="spacer"></div>
    <button class="search-pill" id="search-pill"><svg><use href="#i-search"/></svg><span>Pesquisar arquivos e pastas</span><kbd>/</kbd></button>
    <button class="icon-btn" id="btn-search" aria-label="Pesquisar"><svg><use href="#i-search"/></svg></button>
    <button class="icon-btn" id="btn-view" aria-label="Alterar visualização"><svg><use href="#i-grid"/></svg></button>
    <button class="icon-btn" id="btn-menu" aria-label="Opções"><svg><use href="#i-more"/></svg></button>
  </header>
  <nav class="crumbs" id="crumbs"></nav>
  <main id="browser">
    <section id="favorites" class="favorites hidden">
      <h2>Favoritos</h2>
      <ul class="list" id="fav-list"></ul>
    </section>
    <section id="continue" class="continue hidden">
      <h2>Continuar assistindo</h2>
      <div class="hscroll" id="continue-list"></div>
    </section>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty hidden"></div>
    <div id="loading" class="loading hidden"><div class="spinner"></div></div>
  </main>

  <!-- ============ PESQUISA ============ -->
  <div id="search" class="search hidden">
    <div class="search-bar">
      <button class="icon-btn" id="search-close" aria-label="Fechar pesquisa"><svg><use href="#i-back"/></svg></button>
      <input id="search-input" type="search" placeholder="Pesquisar arquivos e pastas" autocomplete="off" enterkeyhint="search">
      <button class="icon-btn hidden" id="search-clear" aria-label="Limpar"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="chips">
      <button class="chip active" data-scope="here" id="scope-here">Nesta pasta</button>
      <button class="chip" data-scope="all">Tudo</button>
      <button class="chip" id="chip-media">Somente mídia</button>
    </div>
    <div class="search-status" id="search-status"></div>
    <ul class="list" id="search-results"></ul>
  </div>

  <!-- ============ PLAYER ============ -->
  <section id="player" class="player hidden" aria-label="Player">
    <div class="stage" id="stage">
      <video id="video" playsinline webkit-playsinline preload="auto"></video>
      <div class="audio-art hidden" id="audio-art"><svg><use href="#i-audio"/></svg></div>
      <div class="subs" id="subs"></div>
      <div class="ripple left" id="ripple-l"><div class="ripple-inner"><div class="arrows"><svg><use href="#i-rw"/></svg></div><span>10 segundos</span></div></div>
      <div class="ripple right" id="ripple-r"><div class="ripple-inner"><div class="arrows"><svg><use href="#i-ff"/></svg></div><span>10 segundos</span></div></div>
      <div class="pill" id="speed-pill">2x <svg><use href="#i-ff"/></svg></div>
      <div class="pill center-pill" id="info-pill"></div>
      <div class="spinner big hidden" id="spinner"></div>
      <div class="scrub-hint hidden" id="scrub-hint"><img alt=""><span></span></div>

      <div class="controls" id="controls">
        <div class="ctrl-top">
          <button class="icon-btn" id="btn-min" aria-label="Minimizar"><svg><use href="#i-down"/></svg></button>
          <div class="ctrl-title" id="ctrl-title"></div>
          <button class="icon-btn" id="btn-mute" aria-label="Silenciar"><svg><use href="#i-vol"/></svg></button>
          <button class="icon-btn" id="btn-cc" aria-label="Legendas"><svg><use href="#i-subtitle"/></svg></button>
          <button class="icon-btn" id="btn-settings" aria-label="Configurações"><svg><use href="#i-settings"/></svg></button>
        </div>
        <div class="ctrl-center">
          <button class="icon-btn mid" id="btn-prev" aria-label="Anterior"><svg><use href="#i-prev"/></svg></button>
          <button class="icon-btn big" id="btn-play" aria-label="Reproduzir"><svg><use href="#i-play"/></svg></button>
          <button class="icon-btn mid" id="btn-next" aria-label="Próximo"><svg><use href="#i-next"/></svg></button>
        </div>
        <div class="ctrl-bottom">
          <div class="time"><span id="t-cur">0:00</span> / <span id="t-dur">0:00</span><span class="mode-badge" id="mode-badge"></span></div>
          <input type="range" class="vol" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          <button class="icon-btn" id="btn-pip" aria-label="Picture-in-picture"><svg><use href="#i-pip"/></svg></button>
          <button class="icon-btn hidden" id="btn-rotate" aria-label="Girar tela" title="Girar (vertical/horizontal)"><svg><use href="#i-rotate"/></svg></button>
          <button class="icon-btn" id="btn-fs" aria-label="Tela cheia"><svg><use href="#i-fs"/></svg></button>
        </div>
      </div>
      <div class="seek" id="seek">
        <div class="seek-tooltip" id="seek-tip"><img id="seek-img" alt=""><span id="seek-time">0:00</span></div>
        <div class="seek-track"><div class="seek-buf" id="seek-buf"></div><div class="seek-prog" id="seek-prog"></div><div class="seek-knob" id="seek-knob"></div></div>
      </div>
      <div class="upnext hidden" id="upnext">
        <div class="upnext-label">A seguir em <b id="upnext-count">5</b></div>
        <div class="upnext-title" id="upnext-title"></div>
        <div class="upnext-btns"><button class="btn" id="upnext-cancel">Cancelar</button><button class="btn primary" id="upnext-go">Reproduzir agora</button></div>
      </div>
    </div>

    <div class="mini-bar" id="mini-bar">
      <div class="mini-text"><div class="mini-title" id="mini-title"></div><div class="mini-sub" id="mini-sub"></div></div>
      <button class="icon-btn" id="mini-play" aria-label="Reproduzir/pausar"><svg><use href="#i-pause"/></svg></button>
      <button class="icon-btn" id="mini-close" aria-label="Fechar"><svg><use href="#i-close"/></svg></button>
      <div class="mini-prog"><div id="mini-prog"></div></div>
    </div>

    <div class="details" id="details">
      <h1 id="d-title"></h1>
      <div class="d-meta" id="d-meta"></div>
      <div class="d-actions">
        <button class="pill-btn" id="d-download"><svg><use href="#i-download"/></svg>Baixar</button>
        <button class="pill-btn" id="d-link"><svg><use href="#i-link"/></svg>Copiar link</button>
        <button class="pill-btn" id="d-fav"><svg><use href="#i-star-o"/></svg>Favoritar</button>
        <button class="pill-btn" id="d-folder"><svg><use href="#i-folder"/></svg>Abrir pasta</button>
      </div>
      <h2 class="d-next-h">Nesta pasta</h2>
      <ul class="list compact" id="d-list"></ul>
    </div>
  </section>

  <!-- ============ VISUALIZADOR DE IMAGEM ============ -->
  <div id="gallery" class="gallery hidden" role="dialog" aria-label="Fotos">
    <div class="g-track" id="g-track"></div>
    <div class="g-top">
      <button class="icon-btn" id="g-close" aria-label="Fechar"><svg><use href="#i-back"/></svg></button>
      <div class="g-text"><div id="g-title"></div><div id="g-count"></div></div>
      <button class="icon-btn" id="g-play" aria-label="Apresentação" title="Apresentação (espaço)"><svg><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="g-download" aria-label="Baixar" title="Baixar"><svg><use href="#i-download"/></svg></button>
      <button class="icon-btn" id="g-more" aria-label="Mais opções"><svg><use href="#i-more"/></svg></button>
    </div>
    <button class="icon-btn g-nav" id="g-prev" aria-label="Anterior"><svg><use href="#i-back"/></svg></button>
    <button class="icon-btn g-nav" id="g-next" aria-label="Próxima"><svg><use href="#i-right"/></svg></button>
  </div>

  <!-- ============ BOTTOM SHEET ============ -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog"><div class="sheet-handle"></div><div id="sheet-body"></div></div>

  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
<script src="gallery.js"></script>
</body>
</html>
